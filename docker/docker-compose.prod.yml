# docker-compose -f docker-compose.yml -f docker-compose.prod.yml up
services:
  dind:
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  api:
    restart: always
    environment:
      - LOG_LEVEL=info
      - WORKERS=4
    ports:
      - "11000:8000"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  web:
    container_name: unixchallenge-web
    build:
      context: ..
      dockerfile: docker/web.dockerfile
    ports:
      - "11001:80"
    networks:
      - frontend
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M

  runner-builder:
    restart: "no"
