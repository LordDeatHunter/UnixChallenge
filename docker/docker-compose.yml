services:
  # PostgreSQL database
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: unixchallenge
      POSTGRES_USER: unixchallenge
      POSTGRES_PASSWORD: unixchallenge
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - backend
    ports:
      - "54320:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unixchallenge"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Docker-in-Docker service for the test containers
  dind:
    image: docker:29-dind
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: ""
    volumes:
      - docker-cache:/var/lib/docker
    networks:
      - backend
    command: ["dockerd", "--host=tcp://0.0.0.0:2375", "--host=unix:///var/run/docker.sock", "--tls=false"]
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 10s
      timeout: 5s
      retries: 5

  # API service
  api:
    build:
      context: ..
      dockerfile: docker/api.dockerfile
    environment:
      - DOCKER_HOST=tcp://dind:2375
      - DATABASE_URL=postgresql://unixchallenge:unixchallenge@db:5432/unixchallenge
    volumes:
      - ../challenges:/app/challenges:ro
    networks:
      - backend
      - frontend
    depends_on:
      db:
        condition: service_healthy
      dind:
        condition: service_healthy
      runner-builder:
        condition: service_completed_successfully
    restart: unless-stopped

  # Build the runner image in DinD
  runner-builder:
    image: docker:29-cli
    environment:
      - DOCKER_HOST=tcp://dind:2375
    volumes:
      - ../images/runner:/runner:ro
    networks:
      - backend
    depends_on:
      dind:
        condition: service_healthy
    command: >
      sh -c "
        docker build -t unixchallenge-runner:latest /runner &&
        echo 'Runner image built successfully'
      "

volumes:
  docker-cache:
  postgres-data:

networks:
  backend:
    driver: bridge
  frontend:
    driver: bridge
