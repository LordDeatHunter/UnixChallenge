# docker-compose --env-file ../.env -p unixchallenge -f docker-compose.yml -f docker-compose.dev.yml up -d --build
services:
  api:
    container_name: unixchallenge-api-dev
    ports:
      - "8000:8000"
    volumes:
      - ../api:/app/api:ro
      - ../worker:/app/worker:ro
      - ../challenges:/app/challenges:ro
      - ../artifacts:/app/artifacts
    environment:
      - PYTHONUNBUFFERED=1
    command: uv run uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload

  web:
    image: oven/bun:1.3.6-alpine
    pull_policy: always
    container_name: unixchallenge-web-dev
    working_dir: /app
    command: sh -c "bun install --frozen-lockfile && bun run dev --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=${VITE_API_URL}
      - CHOKIDAR_USEPOLLING=1
    volumes:
      - ../web:/app
      - bun-node-modules:/app/node_modules
      - bun-cache:/root/.bun
    networks:
      - frontend
    depends_on:
      - api
    restart: "no"

volumes:
  bun-node-modules:
  bun-cache:
