services:
  api:
    volumes:
      - ../api:/app/api:ro
      - ../worker:/app/worker:ro
      - ../challenges:/app/challenges:ro
      - ../artifacts:/app/artifacts
    environment:
      - PYTHONUNBUFFERED=1
    command: uv run uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload

  web:
    image: oven/bun:1
    working_dir: /app
    command: sh -c "bun install --frozen-lockfile && bun run dev --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=${VITE_API_URL}
      - CHOKIDAR_USEPOLLING=1
    volumes:
      - ../web:/app
      - bun-node-modules:/app/node_modules
      - bun-cache:/root/.bun
    restart: "no"

volumes:
  bun-node-modules:
  bun-cache:
